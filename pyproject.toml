[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-models"
version = "0.1.0"
description = "Shared policy model definitions and observation and action contracts for our agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy", "pre-commit", "pytest", "ruff"]

[tool.uv]
required-version = ">=0.9"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
