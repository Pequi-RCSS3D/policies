[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policies"
version = "0.1.0"
description = "Define, train, export and run part-based policies, extensible through plugins."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "array-api-compat>=1.11",
  "numpy>=2.0",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "structlog>=26.1",
]

[project.optional-dependencies]
# PyTorch for models, learning, training and export. Pick one.
cpu = ["torch>=2.14,<2.15"]
cu126 = ["torch>=2.14,<2.15"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[tool.uv]
required-version = ">=0.9"
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
